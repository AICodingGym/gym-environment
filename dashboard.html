<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="5" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Coding Gym Supervisor Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #111; color: #eee; }
    .card { border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #1b1b1b; }
    .time { color: #9aa; font-size: 12px; margin-bottom: 8px; }
    pre { white-space: pre-wrap; margin: 0; font-size: 12px; }
    .plus { color: #6be675; }
    .minus { color: #ff7b72; }
    .meta { color: #9cc7ff; margin: 4px 0 8px; }
  </style>
</head>
<body>
  <h1>AI Coding Gym Supervisor Dashboard</h1>
  <div class="card">
    <div class="time">ready</div>
    <h3>Supervisor Ready</h3>
    <div class="meta">Template loaded from gym-environment</div>
    <pre>Run ./supervisor.sh --help to start logging runs.</pre>
  </div>
</body>
</html>
