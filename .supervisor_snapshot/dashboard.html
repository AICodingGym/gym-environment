<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="5" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Coding Gym Supervisor Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #111; color: #eee; }
    .card { border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #1b1b1b; }
    .chart-card { border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #161b22; }
    .time { color: #9aa; font-size: 12px; margin-bottom: 8px; }
    pre { white-space: pre-wrap; margin: 0; font-size: 12px; }
    .plus { color: #6be675; }
    .minus { color: #ff7b72; }
    .meta { color: #9cc7ff; margin: 4px 0 8px; }
    .legend { font-size: 12px; margin-top: 8px; color: #9aa; }
    .swatch { display: inline-block; width: 12px; height: 2px; margin: 0 6px 3px 12px; }
    .val { background: #58a6ff; }
    .gt { background: #f78166; }
    canvas { width: 100%; height: 260px; background: #0d1117; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>AI Coding Gym Supervisor Dashboard</h1>
  <div class="chart-card">
    <h3>Accuracy Timeline</h3>
    <canvas id="accuracyChart" width="1000" height="260"></canvas>
    <div class="legend">
      <span class="swatch val"></span> Validation accuracy
      <span class="swatch gt"></span> Ground truth (submission)
    </div>
  </div>
  <div class="card">
    <div class="time">ready</div>
    <h3>Template</h3>
    <div class="meta">Copied from gym-environment</div>
    <pre>Use supervisor.sh to append live run cards here.</pre>
  </div>
  <script>
    (function renderChart() {
      const canvas = document.getElementById("accuracyChart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const points = Array.from(document.querySelectorAll(".card[data-kind]")).map((card) => {
        const ts = card.getAttribute("data-ts") || "";
        const t = Date.parse(ts);
        const val = Number(card.getAttribute("data-val"));
        const gt = Number(card.getAttribute("data-gt"));
        return {
          t: Number.isFinite(t) ? t : NaN,
          val: Number.isFinite(val) ? val : NaN,
          gt: Number.isFinite(gt) ? gt : NaN,
        };
      }).filter((p) => Number.isFinite(p.t)).sort((a, b) => a.t - b.t);

      if (!points.length) return;

      const vals = points.filter((p) => Number.isFinite(p.val)).map((p) => p.val);
      const gts = points.filter((p) => Number.isFinite(p.gt)).map((p) => p.gt);
      const allY = vals.concat(gts);
      if (!allY.length) return;

      const w = canvas.width;
      const h = canvas.height;
      const pad = { l: 52, r: 20, t: 16, b: 30 };
      const minT = points[0].t;
      const maxT = points[points.length - 1].t || minT + 1;
      const minY = Math.min(...allY);
      const maxY = Math.max(...allY);
      const ySpan = maxY === minY ? 1 : (maxY - minY);

      const x = (t) => pad.l + ((t - minT) / Math.max(1, maxT - minT)) * (w - pad.l - pad.r);
      const y = (v) => h - pad.b - ((v - minY) / ySpan) * (h - pad.t - pad.b);

      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "#30363d";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.l, pad.t);
      ctx.lineTo(pad.l, h - pad.b);
      ctx.lineTo(w - pad.r, h - pad.b);
      ctx.stroke();

      const drawSeries = (values, color) => {
        if (!values.length) return;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        values.forEach((p, idx) => {
          const px = x(p.t);
          const py = y(p.v);
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.stroke();
        ctx.fillStyle = color;
        values.forEach((p) => {
          ctx.beginPath();
          ctx.arc(x(p.t), y(p.v), 2.8, 0, Math.PI * 2);
          ctx.fill();
        });
      };

      drawSeries(points.filter((p) => Number.isFinite(p.val)).map((p) => ({ t: p.t, v: p.val })), "#58a6ff");
      drawSeries(points.filter((p) => Number.isFinite(p.gt)).map((p) => ({ t: p.t, v: p.gt })), "#f78166");

      ctx.fillStyle = "#8b949e";
      ctx.font = "11px Arial";
      ctx.fillText(minY.toFixed(4), 8, h - pad.b + 4);
      ctx.fillText(maxY.toFixed(4), 8, pad.t + 4);
    })();
  </script>
</body>
</html>
